name: Spider Jar Gen CI

on:
  push:
    branches: [ "mine" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Build APK with Gradle
      run: |
        ./gradlew assembleRelease --stacktrace --no-daemon
        if ($LASTEXITCODE -ne 0) { exit 1 }
        dir app\build\intermediates\dex\release\minifyReleaseWithR8\

    - name: Generate Spider JAR
      run: |
        cd jar
        call genJar.bat ec
        dir custom_spider.jar

    - name: Upload spider jar artifact
      uses: actions/upload-artifact@v4
      with:
        name: custom_spider
        path: |
          jar/custom_spider.jar
          jar/custom_spider.jar.md5

    - name: Commit and push JAR
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add jar/custom_spider.jar jar/custom_spider.jar.md5
        git diff --cached --quiet || (git commit -m "update spider jar" && git push)